[project]
name = "corn-insurance-risk-analytics"
version = "0.1.0"
description = "Backend API for corn price forecasting and agricultural insurance risk analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic-settings>=2.4,<3.0",
    "pyarrow>=19,<24",
    "pymysql>=1.1,<2",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "ruff>=0.11,<1.0",
]
uqer = [
    "pandas>=2.3.1",
    "uqer==1.3.39",
    "pip==23.3.2",
    "requests>=2.31,<3",
]
research = [
    "pandas>=2.3,<4",
    "numpy>=2,<3",
    "scikit-learn>=1.5,<2",
    "xgboost>=2,<4",
]
inference = [
    "numpy>=2,<3",
    "pandas>=2.3,<4",
    "scikit-learn>=1.5,<2",
    "xgboost>=2,<4",
    "joblib>=1.4,<2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
